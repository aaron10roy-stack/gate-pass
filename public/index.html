<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GatePass Pro</title>
    <!-- Modern Typeface -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- QR Code Library via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Animated background -->
    <div class="mesh-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>
    <div id="app">
        <!-- SPA Views will be injected here dynamically by app.js -->
    </div>
    
    <!-- TEMPLATE: LOGIN -->
    <template id="tmpl-login">
        <div class="login-container fade-in">
            <div class="glass-card">
                <h1>GatePass Pro</h1>
                <p class="subtitle">Digital Campus Management</p>
                <form id="login-form">
                    <div class="input-group">
                        <label>Email</label>
                        <input type="email" id="email" required placeholder="name@gatepass.com">
                    </div>
                    <div class="input-group">
                        <label>Password</label>
                        <input type="password" id="password" required placeholder="Enter password">
                      
                    </div>
                    <button type="submit" class="btn-primary">Sign In</button>
                    <div id="login-error" class="error-msg"></div>
                </form>
            </div>
        </div>
    </template>
    
    <!-- TEMPLATE: STUDENT DASHBOARD -->
    <template id="tmpl-student">
        <nav class="navbar glass-nav">
            <div class="nav-brand">GatePass Pro <span style="font-weight:400; font-size:0.9rem; opacity:0.8;">| Student</span></div>
            <button class="btn-logout" onclick="app.logout()">Logout</button>
        </nav>
        <div class="dashboard-container fade-in">
            <div class="glass-card main-card">
                <h2>Request Gate Pass</h2>
                <form id="request-form">
                    <div class="grid-2">
                        <div class="input-group">
                            <label>Date</label>
                            <input type="date" id="req-date" required>
                        </div>
                        <div class="input-group">
                            <label>Entry Time</label>
                            <input type="time" id="req-entry" required>
                        </div>
                        <div class="input-group">
                            <label>Expected Exit</label>
                            <input type="time" id="req-exit" required>
                        </div>
                    </div>
                    <div class="input-group">
                        <label>Reason</label>
                        <input type="text" id="req-reason" required placeholder="Brief reason for campus entry">
                    </div>
                    <button type="submit" class="btn-primary">Submit Request</button>
                    <div id="req-msg" class="mt-1"></div>
                </form>
            </div>
            
            <div class="glass-card list-card">
                <h2>My Pass History</h2>
                <div class="table-responsive">
                    <table class="modern-table">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Entry Time</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="student-requests-list">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        
        <!-- Modal for QR Code -->
        <div id="qr-modal" class="modal hidden">
            <div class="modal-content glass-card">
                <span class="close-modal" onclick="app.closeModal()">&times;</span>
                <h2 style="margin-bottom:0.5rem">Pass QR Code</h2>
                <div id="qrcode-display"></div>
                <p id="qr-pass-info"></p>
                <small style="color:var(--text-secondary)">Present this to security at the gate</small>
            </div>
        </div>
    </template>

    <!-- TEMPLATE: APPROVER DASHBOARD -->
    <template id="tmpl-approver">
        <nav class="navbar glass-nav">
            <div class="nav-brand">GatePass Pro <span style="font-weight:400; font-size:0.9rem; opacity:0.8;">| Approver</span></div>
            <button class="btn-logout" onclick="app.logout()">Logout</button>
        </nav>
        <div class="dashboard-container fade-in" style="max-width: 900px;">
            <div class="glass-card list-card" style="grid-column: 1 / -1;">
                <h2>Pending Requests</h2>
                <div class="table-responsive">
                    <table class="modern-table">
                        <thead>
                            <tr>
                                <th>Student</th>
                                <th>Date</th>
                                <th>Entry / Exit Time</th>
                                <th>Reason</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="approver-requests-list">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </template>

    <!-- TEMPLATE: SECURITY DASHBOARD -->
    <template id="tmpl-security">
        <nav class="navbar glass-nav">
            <div class="nav-brand">GatePass Pro <span style="font-weight:400; font-size:0.9rem; opacity:0.8;">| Security</span></div>
            <button class="btn-logout" onclick="app.logout()">Logout</button>
        </nav>
        <div class="dashboard-container fade-in" style="max-width: 600px;">
            <div class="glass-card main-card scanner-card">
                <h2>Verify Pass</h2>
                <p class="subtitle" style="margin-bottom:1rem">Scan QR or enter Pass ID manually</p>
                <div class="input-group" style="display:flex; gap:10px; align-items:center;">
                    <input type="text" id="manual-pass-id" placeholder="Enter Pass ID" style="margin-bottom:0;">
                    <button class="btn-primary" style="width:auto; padding:0.75rem 1.5rem;" onclick="app.verifyPassManual()">Verify</button>
                </div>
                
                <div class="scanner-placeholder">
                    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 1rem; opacity: 0.8"><path d="M4 4h4v4H4z"></path><path d="M4 16h4v4H4z"></path><path d="M16 4h4v4h-4z"></path><path d="M16 16h4v4h-4z"></path><path d="M10 10h4v4h-4z"></path><path d="M10 4h.01"></path><path d="M10 16h.01"></path><path d="M10 20h.01"></path><path d="M14 4h.01"></path><path d="M14 20h.01"></path><path d="M16 10h.01"></path><path d="M20 10h.01"></path><path d="M4 10h.01"></path><path d="M4 14h.01"></path></svg><br>
                    <span>Point device camera at QR Code</span><br>
                    <small>Simulation Mode</small>
                </div>
                
                <div id="verification-result" class="hidden result-box">
                    <h3 id="vr-status"></h3>
                    <p id="vr-details"></p>
                    <div id="action-buttons-sec" class="action-buttons-sec hidden">
                        <button class="btn-success btn-sm" onclick="app.logAction('entry')">Log Gate Entry</button>
                        <button class="btn-warning btn-sm" onclick="app.logAction('exit')">Log Gate Exit</button>
                    </div>
                    <div id="vr-msg" class="mt-1"></div>
                </div>
            </div>
        </div>
    </template>

    <script src="js/app.js"></script>
</body>
</html>
